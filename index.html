<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philly Weather</title>
</head>
<body>

<div class="sign" id="sign">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Philly Weather</div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate">--</div>
    </div>
  </div>

  <div class="aqi-banner" id="aqiBanner">
    <div class="aqi-main">
      <span class="aqi-label">CITYWIDE AIR QUALITY INDEX</span>
      <span class="aqi-value" id="aqiValue">&mdash;</span>
      <span class="aqi-cat" id="aqiCat">&mdash;</span>
    </div>
    <p class="aqi-def" id="aqiDef">Reading conditions&hellip;</p>
    <div class="aqi-scale" id="aqiScale"></div>
  </div>

  <div class="stage" id="stage">
    <div class="loading-msg" id="loadingMsg">Reading the city&hellip;</div>

    <svg class="map-svg" id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <g class="neighborhoods">
        <polygon class="hood" points="-5,-5 32,-5 27,20 6,24"/>
        <polygon class="hood alt" points="32,-5 68,-5 74,18 40,22"/>
        <polygon class="hood" points="68,-5 105,-5 105,22 74,18"/>
        <polygon class="hood alt" points="-5,24 6,24 22,46 -5,50"/>
        <polygon class="hood" points="27,20 40,22 58,40 22,46 6,24"/>
        <polygon class="hood alt" points="40,22 74,18 105,22 105,58 62,50 58,40"/>
        <polygon class="hood" points="-5,50 22,46 30,74 8,80 -5,72"/>
        <polygon class="hood alt" points="22,46 58,40 62,50 55,72 30,74"/>
        <polygon class="hood" points="62,50 105,58 105,95 58,86 55,72"/>
        <polygon class="hood alt" points="-5,72 8,80 32,100 -5,105"/>
        <polygon class="hood" points="8,80 30,74 55,72 58,86 42,100 32,100"/>
        <polygon class="hood alt" points="58,86 105,95 105,105 42,100"/>
      </g>
      <path class="river" d="M 34,-5 C 20,10 15,24 18,34 C 21,45 9,50 7,60 C 5,70 12,84 21,105" />
      <line class="parkway" x1="44" y1="8" x2="48" y2="54" />
      <g class="grid-lines">
        <line x1="30" y1="0" x2="30" y2="100"/>
        <line x1="50" y1="0" x2="50" y2="100"/>
        <line x1="70" y1="0" x2="70" y2="100"/>
        <line x1="90" y1="0" x2="90" y2="100"/>
        <line x1="0" y1="35" x2="100" y2="35"/>
        <line x1="0" y1="55" x2="100" y2="55"/>
        <line x1="0" y1="75" x2="100" y2="75"/>
      </g>
    </svg>

    <div class="pins" id="pins"></div>
  </div>

  <div class="rail">
    <p class="footnote" id="footnote"></p>
    <div class="updated" id="updatedAt">Updating&hellip;</div>
  </div>
</div>

<script src="./script.js"></script>
</body>
</html>
