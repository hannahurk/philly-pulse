<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philly Pulse</title>
</head>
<body>

<div class="sign" id="sign">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Philly Pulse</div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate">--</div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="loading-msg" id="loadingMsg">Reading the city&hellip;</div>

    <svg class="map-svg" id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="river" d="M 34,-5 C 20,10 15,24 18,34 C 21,45 9,50 7,60 C 5,70 12,84 21,105" />
      <line class="parkway" x1="8" y1="6" x2="62" y2="62" />
      <g class="grid-lines">
        <line x1="30" y1="0" x2="30" y2="100"/>
        <line x1="50" y1="0" x2="50" y2="100"/>
        <line x1="70" y1="0" x2="70" y2="100"/>
        <line x1="90" y1="0" x2="90" y2="100"/>
        <line x1="0" y1="35" x2="100" y2="35"/>
        <line x1="0" y1="55" x2="100" y2="55"/>
        <line x1="0" y1="75" x2="100" y2="75"/>
      </g>
    </svg>

    <div class="pins" id="pins"></div>
  </div>

  <div class="rail">
    <div class="aqi-badge" id="aqiBadge">
      <span class="aqi-label">CITYWIDE AQI</span>
      <span class="aqi-value" id="aqiValue">&mdash;</span>
      <span class="aqi-cat" id="aqiCat">&mdash;</span>
    </div>
    <p class="footnote">Temperature is hyperlocal &middot; air quality is measured citywide</p>
    <div class="updated" id="updatedAt">Updating&hellip;</div>
  </div>
</div>

<script src="./script.js"></script>
</body>
</html>
